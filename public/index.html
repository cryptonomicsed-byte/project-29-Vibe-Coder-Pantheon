<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥⚡ Vibe Coder Pantheon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px;
    }
    
    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcf7f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      color: #888;
      font-size: 1.1em;
    }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 25px;
      backdrop-filter: blur(10px);
    }
    
    .card h2 {
      margin-bottom: 20px;
      font-size: 1.5em;
      color: #ffd93d;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #b0b0b0;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 1em;
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #ffd93d;
      background: rgba(255, 255, 255, 0.12);
    }
    
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #ff6b6b, #ff8c42);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 1.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .status {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 0.9em;
    }
    
    .status.ready {
      background: rgba(107, 199, 127, 0.2);
      color: #6bcf7f;
      border: 1px solid rgba(107, 199, 127, 0.3);
    }
    
    .status.error {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.3);
    }
    
    .status.warning {
      background: rgba(255, 217, 61, 0.2);
      color: #ffd93d;
      border: 1px solid rgba(255, 217, 61, 0.3);
    }
    
    .output-section {
      grid-column: 1 / -1;
    }
    
    .output-section h2 {
      color: #ffd93d;
      margin-bottom: 15px;
    }
    
    #output {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 20px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      line-height: 1.6;
    }
    
    .phase {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .phase:last-child {
      border-bottom: none;
    }
    
    .phase-label {
      color: #ffd93d;
      font-weight: bold;
    }
    
    .phase-content {
      color: #b0b0b0;
      margin-top: 5px;
    }
    
    .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
      
      h1 {
        font-size: 1.8em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔥⚡ Vibe Coder Pantheon</h1>
      <p class="subtitle">Transform ideas into production code via 21 AI agents</p>
    </header>
    
    <div class="grid">
      <!-- Config Card -->
      <div class="card">
        <h2>⚙️ Configuration</h2>
        <div id="status" class="status warning">Initializing...</div>
        
        <div class="form-group">
          <label for="provider">API Provider:</label>
          <select id="provider" onchange="updateProvider()">
            <option value="">Loading providers...</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="apiKey">API Key:</label>
          <input type="password" id="apiKey" placeholder="Paste your API key...">
        </div>
        
        <div style="font-size: 0.85em; color: #888; margin-bottom: 15px;">
          Get free API keys:
          <a href="https://platform.openai.com" target="_blank" style="color: #ffd93d; text-decoration: none;">OpenAI</a> •
          <a href="https://console.anthropic.com" target="_blank" style="color: #ffd93d; text-decoration: none;">Claude</a> •
          <a href="https://aistudio.google.com" target="_blank" style="color: #ffd93d; text-decoration: none;">Gemini</a> •
          <a href="https://console.mistral.ai" target="_blank" style="color: #ffd93d; text-decoration: none;">Mistral</a>
        </div>
        
        <button onclick="saveConfig()">💾 Save Configuration</button>
      </div>
      
      <!-- Vibe Card -->
      <div class="card">
        <h2>🎨 Your Vibe</h2>
        
        <div class="form-group">
          <label for="vibe">Describe your app idea:</label>
          <textarea id="vibe" placeholder="E.g., Build a Todo app with auth, dark mode, drag-and-drop, React + Tailwind..."></textarea>
        </div>
        
        <button onclick="submitVibe()" id="submitBtn">🚀 Invoke Pantheon</button>
        <button onclick="useExample()" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); margin-top: 5px;">📝 Use Example</button>
      </div>
      
      <!-- Output Card -->
      <div class="card output-section">
        <h2>📊 Pantheon Output</h2>
        <div id="output">
          <p style="color: #666;">Output will appear here...</p>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    let providers = {};
    
    // Load providers and status on startup
    window.addEventListener('load', async () => {
      await loadProviders();
      checkStatus();
    });
    
    async function loadProviders() {
      try {
        const res = await fetch('/api/providers');
        providers = await res.json();
        
        const select = document.getElementById('provider');
        select.innerHTML = '<option value="">Select provider...</option>';
        
        for (const [key, name] of Object.entries(providers)) {
          const option = document.createElement('option');
          option.value = key;
          option.textContent = name;
          select.appendChild(option);
        }
      } catch (e) {
        console.error('Failed to load providers:', e);
      }
    }
    
    async function checkStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        updateStatusUI(data);
      } catch (e) {
        setStatus('error', '❌ Server not responding');
      }
    }
    
    function updateStatusUI(data) {
      const statusEl = document.getElementById('status');
      
      if (data.configured) {
        const providerName = providers[data.provider] || data.provider;
        setStatus('ready', `✅ Configured: ${providerName}`);
      } else {
        setStatus('warning', '⚠️ Configure API key first');
      }
    }
    
    function setStatus(type, message) {
      const statusEl = document.getElementById('status');
      statusEl.className = `status ${type}`;
      statusEl.textContent = message;
    }
    
    async function saveConfig() {
      const provider = document.getElementById('provider').value;
      const apiKey = document.getElementById('apiKey').value;
      
      if (!provider || !apiKey) {
        setStatus('error', '❌ Please select provider and enter API key');
        return;
      }
      
      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider, apiKey })
        });
        
        if (res.ok) {
          const data = await res.json();
          setStatus('ready', `✅ API key saved for ${data.providerName}`);
          document.getElementById('apiKey').value = '';
        } else {
          const error = await res.json();
          setStatus('error', `❌ Error: ${error.error}`);
        }
      } catch (e) {
        setStatus('error', `❌ Error: ${e.message}`);
      }
    }
    
    function useExample() {
      document.getElementById('vibe').value = 
        'Build a beautiful Todo App with user authentication (email/password), dark mode, drag-and-drop reordering, and persistent storage using localStorage. Make it responsive, modern UI with Tailwind CSS, built with React + Vite.';
    }
    
    async function submitVibe() {
      const vibe = document.getElementById('vibe').value.trim();
      
      if (!vibe) {
        setStatus('error', '❌ Please describe your vibe');
        return;
      }
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '⏳ <span class="spinner">⚡</span> Processing...';
      
      const outputEl = document.getElementById('output');
      outputEl.innerHTML = '<p style="color: #ffd93d;">🔮 Pantheon summoning agents...</p>';
      
      try {
        const res = await fetch('/api/vibe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vibe })
        });
        
        if (!res.ok) {
          const error = await res.json();
          outputEl.innerHTML = `<p style="color: #ff6b6b;">❌ Error: ${error.error}</p>`;
          submitBtn.disabled = false;
          submitBtn.innerHTML = '🚀 Invoke Pantheon';
          return;
        }
        
        // Parse SSE stream
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let phases = [];
        
        outputEl.innerHTML = '';
        
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const text = decoder.decode(value);
          const lines = text.split('\n');
          
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const json = JSON.parse(line.slice(6));
              
              if (json.type === 'start') {
                outputEl.innerHTML += `<div style="color: #ffd93d; margin-bottom: 10px;"><strong>${json.message}</strong></div>`;
              } else if (json.type === 'phase') {
                outputEl.innerHTML += `<div class="phase"><span class="phase-label">Phase ${json.phase}:</span> <span class="phase-content">${json.content}</span></div>`;
              } else if (json.type === 'error') {
                outputEl.innerHTML += `<div style="color: #ff6b6b;">❌ ${json.message}</div>`;
              } else if (json.type === 'complete') {
                outputEl.innerHTML += `<div style="color: #6bcf7f; margin-top: 15px; font-weight: bold;">✅ ${json.message}</div>`;
              }
              
              outputEl.scrollTop = outputEl.scrollHeight;
            }
          }
        }
      } catch (e) {
        outputEl.innerHTML = `<p style="color: #ff6b6b;">❌ Error: ${e.message}</p>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '🚀 Invoke Pantheon';
      }
    }
    
    function updateProvider() {
      const provider = document.getElementById('provider').value;
      const keyInput = document.getElementById('apiKey');
      
      const prefixes = {
        'openai': 'sk-...',
        'claude': 'sk-ant-...',
        'gemini': 'AIza...',
        'mistral': 'eyJ0eXAi...',
        'groq': 'gsk_...',
        'perplexity': 'pplx-...',
        'cohere': 'sk-...',
        'ollama': 'optional'
      };
      
      keyInput.placeholder = prefixes[provider] || 'Paste your API key...';
    }
  </script>
</body>
</html>
